[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "autobehaver"
dynamic = ["version"]
description = "Pipeline utilities for processing and analyzing behavior videos."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-US-Government-Work"
license-files = ["LICENSE.txt"]
authors = [
  { name = "NIH/NHLBI" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]

# environment/ pins the scientific stack. Editable installation registers
# the source package after that environment has been created.
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.6,<7", "paramiko>=3.4,<5"]
monitoring = [
  "psutil>=5.9,<8",
  "nvidia-ml-py>=12,<14",
]
dev = [
  "pytest==8.4.1",
  "pytest-cov==7.1.0",
]

[project.scripts]
autobehaver = "autobehaver.__main__:main"
autobehaver-desktop = "autobehaver.desktop:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["autobehaver*"]
exclude = ["autobehaver.resources", "autobehaver.resources.*"]

[tool.setuptools.package-data]
autobehaver = ["preinf/keypre/feature_schema.json", "postinf/mmgen/feature_schema_catalog.json"]

[tool.setuptools.dynamic]
version = {attr = "autobehaver._version.__version__"}

[tool.pytest.ini_options]
markers = [
  "slow: native model or feature-analysis integration checks",
]

[tool.coverage.run]
branch = true
source = ["autobehaver"]

[tool.coverage.report]
show_missing = true
skip_covered = true
