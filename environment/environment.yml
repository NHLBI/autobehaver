name: autobehaver
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip>=26.2
  - setuptools>=83
  - wheel>=0.46.2
  - ffmpeg
  - pip:
      # Relative paths use this file's directory; local OpenCV enables review windows.
      - -r requirements-local-core.txt
      - -e ..
